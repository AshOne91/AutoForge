[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge"
version = "0.1.0"
description = "Development Automation Platform"
requires-python = ">=3.12"

dependencies = [
    "typer",
    "rich",
    "pydantic",
    "pyyaml",
    "jinja2",
    "gitpython",
    "watchdog",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
test = ["httpx", "pytest"]
server = ["asyncpg>=0.30,<1", "sqlalchemy>=2.0,<3"]

[project.scripts]
autoforge = "autoforge.cli.app:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires an external integration service"]

[tool.ruff]
target-version = "py312"
