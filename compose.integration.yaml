services:
  control-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autoforge_control
      POSTGRES_USER: autoforge_test
      POSTGRES_PASSWORD: autoforge_test_password
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - ./deploy/postgresql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoforge_test -d autoforge_control"]
      interval: 2s
      timeout: 3s
      retries: 30
